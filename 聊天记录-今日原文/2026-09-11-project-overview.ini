## 「够」判在哪一层

契约里的 `sufficient` 是**对窗内某一个 bookKey**说的：这段 T 是否触及 Q 核心、能不能铸一条 prospect。  
不是在说：「我已经穷尽全书，答案完备。」

所以 decide **从不**用「读完」来证明「够」。它只用**已读到的那几段**做局部判断：

| 状态 | 含义 |
|---|---|
| sufficient | 这段已能给 Q 一条可递送的可能 → 铸 prospect |
| insufficient | 这段已读，但没碰到 Q / 撑不起 prospect |
| unread | 还没处理到 |

「够不够回答问题」真正落地的是台侧调度：  
**有可铸 prospect → 可以进 infer 试答**（satisficing），不是「证明后面再没有更好材料」。

## 没读完怎么敢停？

**不敢「保证最优」，只敢「够开一枪」。**

- 未读页里可能还有更狠的拉康批判——永远可能。  
- 若要求读完才敢答，无 peek 全量走廊会变成必扫全书，成本和「扩搜挂死」就是这次的形态。  
- 架构取舍是：先用已铸 prospect 去 infer；若你不满意，再钉窗 / 换问 / 续 expand。

旧契约里曾有整窗 `coverage: enough|partial`；无 peek 实验收成**按 key 三态**，整窗「材料已够」不再由 LLM 报一个总闸，而由台侧看 **mintableCount**。

## 和这次跑法的关系

全量走廊关掉了「首个可铸就停批」，所以它其实**扫了很多批**才攒出那 5 个 prospectKey；挂住是因为后面仍被 `insufficient/expand` 拖去空扩，不是因为「不知够不够」。

刚改的调度是：

- 有可铸 → **暂停 decide、进 infer**（你说的「觉得够答了就停」）  
- 仍不假装：未读走廊 = 未知；只承认「手头已有可递送增量」

一句话：**读完证明完备；有 prospect 只证明可试答。Decide 管后者，不管前者。**

