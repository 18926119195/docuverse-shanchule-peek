## Assistant

对，调度序应是这样：

**decide 扫完 → 有可铸才 infer → infer 判定不够才 seedRange**

之前错在把 decide 窗内的 `insufficient` / `stopReason:expand` 当成立刻空扩的信号，走廊还没交给 infer 就扩，扩完又全是已扫过的书 → 挂死。

已按这个序改完：

1. **decide 阶段禁止 seedRange**（只：未读续滚 / 有可铸→infer / 无可铸→挂起草案并 pause）
2. **有 prospect → infer**；decide 留下的 seedRange 闭集先留着，不清掉
3. **infer 判定不够**（无 ι / 自报未到位 / 材料几乎全 insufficient）→ 才展开 seedRange → 再 decide → 再 infer（最多 `MAX_HOT_PEEK` 次）

「够不够」拆成两层就不矛盾了：decide 的 sufficient 只说「这段能铸 prospect」；全书是否够答，交给 **infer 读完这些材料之后** 再判。

