Mais revenons à nos trois voix primordiales. Notre problème devient désormais de positionner convenable la troisième, celle de l'autoriférence, par rapport à celles des pouvoirs et des savoirs. Je la ai définie comme étant la plus singulère, la plus contingente, celle qui ancre les réalités humanes dans la finitude, et aussi la plus universelle, celle qui opère les traversées les plus fulgurantes entre des domaines hétérônes. La fdairt逸

