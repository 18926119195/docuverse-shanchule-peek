T:
La pensée classique tenait l'ame éloignée de la matière et l'essence du sujet à distance des rouages corporels. De leur cœur, les marxistes opposaient les superstructures subjectives aux raptures de production infrastructuraux. Comment peut-on parler aujourd'hui de production de subjectivité? Un premier constat nous conduit à reconnaître que les contenus de la subjectivité dépendent toujours plus d'une multitude de systèmes machiniques. Aucun domaine d'opinion, de pensée, d'image, d'affects, de narrativité, ne peut desmorais prérenter échapper à l'emprise enhavissante de l'assistance par ordinateur; des banques de données, de la telématique, etc. Dès lors, on en vient même à de demander si la sousjet du sujet — cette fame essence, après laquelle la philosophie occidentale court depuis des siècles — ne tres pleuve pas elle-même menace par cette nouvelle — machine-dépendance » de la subjectivité. On sait le curieux mélange d'enrichissement et d'approuvissement qui en est résulté jusqu'à présent: une apparente démocratisation de l'accession aux données, associée à une refermure ségregative de leurs instances d'élaboration; une multiplication des angles d'arché anthropologiques, un bra

bookKey=`h1.Kys3sZkL-bTyuG4mhtLZjwh39JFkXEu2TY5E2JD32m8Jdvi2qJKTYxcq5G9Nd982-3Jk5uvfVbePedxMWqWa5SLH7NjzEywKmw1k5fWf_IDjzfcrM4uR2LrOmnaxmUV1E_t36pce8d6zxvxkTA`
T:
on peut tenter de récuser le dilemme du refus crispé ou de l'acceptation cynique de la situation.

bookKey=`h1.ZcWQgNga4fbnYIVZxRfwe_1BwvSrt-2pk7nGI0Ki46StQy0u95wNItpB6Hm-M1Cy_5bKBFIsLFTywH9UvGTu0nvmC8QlzG0sN1QL5byUQgnCVb2cyfX1n8B13qSd7L52QxtNIrszWX9NKDUWtg`
T:
etics, qu'cije je regrouperai sous la dénomination générale d'Equipements collectifs de subjectivité. Il en allait par exemple ainsi des machines monacales, qui portent jusqu'à nous les mémoires de l'Antiquité, en fondant au passage notre modernité. Qu'étient-elles d'autre que les logiciels, les « macro-processus» du Moyen Age – les mésoplatoniciens ayant été à leur façon, les premiers concepteurs d'une processualité capable de traverser le temps et les stages. Et la Cour de Versailles, qu'etaitaire d'autre, avec sa gestion minutieuse des flux de pouvoir, d'argent, de prestige, de compétence et ses étiquettes de haute precision, sinon une machine délibérément conque pour secréter une subjectivité aristocratique de rechange, beaucoup plus soumise à la royauté étatique que ne l'aient ces des seigneuries de tradition fédale et amortant d'autres rapports d'assujettissement aux valeurs et aux murs de bourgesiois montantes?

