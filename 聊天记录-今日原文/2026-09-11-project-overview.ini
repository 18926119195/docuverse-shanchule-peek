T:
de dimensions hétérogenes, c'est-à-dire d'occasions de singulariser son enonction. Ton pluot que l'unidimensionalité d'une temporalisation réduite à la linéarité informationnelle du Chronos capitalistique, puissance d'voratrice de traductibilisation et de mise en équivalant généralisé des modes de discursivité, des régimes de temporalisation et des durées existentielles. Il appariendra tous aux métal-modifications mythiques, esthétiques, shizophreniques et autres, de cartographier les montages de composantes temporales, à base de modules, ritournelles, etc., qui concurrent à la spécification d'Agencements concrets d'enonction. Remarquons cependant que, lorsque je propose qu'il soit nécessaire d'un quadrature, je ne pretends nullement qu'il soit nécessaire d'un passer par elles pour explorer la chimie enonciative! J'entends seulement indiquer que on ne peut aborder ce domaine à la façon des phénoménologies naives, ou philosophiquement « armées ». Les temps sont composites et sans censeur, recompensée à partir d'instrumentation et d'experimentation, qui dans tel type de composants qui,
bookKey=`h1.u2lzm6TOY5w4HwHqotO9S9duNnM3bNP-W9L-hZxRN6tFq5Ds94mt6fnE_upB0u9U8hHWhXago4iyRc4oXgcD49YUnEGLlOxlE1FAplJMd-cdA2wraPh7dajMqZxqmi29a94FvmjDVcZwCdCWGzOj`
T:
quatre puissances de causalité, « les décesses des biens » : Diké, pour les causes formelles s'incarnant dans les Propositions machiniques abstraites de notre domaine M₂; Moira pour les causes finales, cette « part maudite que l'initiie pour transformer en moment fecond de liberté créative », dans le domaine U; Ananké, pour les causes matérielisant la cirisconception de la finitude existentielle; et,face à elles trois, l'hubris chaumisque des causes efficiens de l'autonico-élection. Le croisement des temporales discursives avec les durées existentielle ne va pas de soi. Il n'est pas mécanique; il doit être agené, agené. Exemple : au volunt de mon auto, je conduis, sommelier, tel un « pilote automatique » divers temporales organisants, et piloteleurs travaillors alors de façon relativement autonomes, dans un rapport direct d'asservissement cybernetique avec la machine et avec le passage qui défile. Durée rentable d'une réverie diurne d'un côté; au extrême, extrême vigilance au moundre indice d'incident. Incident d'aillleurs susceptible de rebrancher ensemble durées et temporales machiniques, je veux dire de me réverifier de bon! Exemple encore d'un petit prof, me même d'un chercheur
bookKey=`h1.Fc1g0m-tjHxucO1E8tCGpWjoJeX4-WdMXbNSnPeSUzy5JWwnIRXXWT-lynJGT3Wps02ZjwsevYGSZgNA0DBh-tChkzQbOMdOhLwdheqZo47TUmMCIuEzH4Te1IICt7ipl5wesQXN4IGmD9EPkeAn`
T:
L'état chaumisque-synaptique advent lorsque se constitue une tension temporelle aionique, c'est-à-dire lorsqu'un champ de virtualité envait de façon hégemonique un état de choses, sans plus se soucier des trois strats de l'avant, d pendant et de l'après. Moment fécond du délire, selon François Tosquelles, instant de voir selon Jacques Lacan, minute d'eternité pour les surrealistes, Satori Zeni, ou plus simplement retournement gestalistes, dans le registre de la perception... On relevera ici une nouvelle définition du virtuel comme possible du possible, comme ce qui autorise existentiellement le déploiement d'un champ de possible, délicé de ligne de discursivite lui-même non discursif, s'instaurant avant l'opposition discursivite/non-discursivite.
