6. Mme Freud en personne 1, tandis q'ailleurs ce sont les *locations qui sont traitées comme des personnes 2*. L'object fonctionne ainsi comme *neud* de surdértermination 3, *ombilic* du rive, point où il sattrache à l'inconnu 4 et à partir duquel il fait piloterifier des lignes indéfinies de singularisation. La deterritorialisation marquera encore quelques points avec la sortie kleinienne de l'object pulsionnel de son cadre personologique pour devenir *partiel*. A partir de la porta, la porte aurait pu suvrir v'autres devenirs non humains, animaux, végétaux, cosmiques, les façons possibles: parce que des objets partiels en question, il sera dressé une liste exhaustive et typifine; parce qu'on s'en servira jalons normatifs du *pourcu* du combattant auquel est censé s'asindre toute subjectivité parvenir aux站és suprémes de la *génitalité oblative*; parce que de *mauvais objets* en *bons objets* et, de *relation d'objet* et *objs transitionnels* en *puis en objets* a en *les générations freudiennes successives finirent par en faire une fonction générique, le dépoussé de ses traits de singularité.

