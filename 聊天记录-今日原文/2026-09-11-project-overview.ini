**校准**就是钉一个对照点：你正在看的机器页（strand）= 书上印的第几页。

公式在 `pageCalibration.ts`：

```text
offset = strand − 印码
之后任意印码 → strand = 印码 + offset
```

例：球上是 strand `50`，书角印着 `67`，则 offset=`-17`；目录写「第 100 页」→ strand=`83`。

