T:
Pourquoi ce raienti de la chasmosse, qui confine à l'immunità? Parce que me l'infinit du temps ne saurait suffire pour lui permettre d'attendre son ideal de determinabilité absolue ou, en d'autres termes, de complexification sans limites. De retrouver une perpétuellement à la tangente d'elle-même la constitue, ici et partout en tension, en tension virtuelle. Aux quatre coins du cosmos et nulle part en particulier, toujours le sourire du chat d'Alice! Et c'est précisément à ce nexus du paradoxe que l'état chaotique rejoign l'état chaotique, son extréme inverse, celui-ci n'sinstaurant qu'au terme d'une innéure durée processuelle et celui-sé dissolvant à la prime racine de l'instant. Pas le temps de souffleur que tout s'est d'édissus! Les laps de temps, aussi courts qu'on voudra l'imaginer, comme la nuit des temps sans horizon, sont victimes de la même fèure déterritorialisante qui les projettent l'umme l'autre, huit d'un réel attestable, dans de univers Divers de virtualité. Dors lés, c'est l'idée même qu'un instant puisse diachroniquement courir le cheval entre deux processus qui tend à perdre sa pertinence hors des sentiers purément speculatifs. C'est cette irréductible ambivalence
