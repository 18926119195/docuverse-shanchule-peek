## Assistant

能。而且**真正烧 token 的往往不是 prospectKey/inferKey，而是窗里反复回传的长 `h1.…` bookKey**。

## 谁在吃 token

| 键 | 谁铸 | 是否必须进 LLM |
|---|---|---|
| `h1.…` bookKey | 协议封印（时空坐标） | decide/infer **必须**字符级回传 |
| `pk_…` / `ik_…` | 台侧 settle（方案 B） | decide/infer **多数时候不必进窗**；path/reuse/监督才要 |
| `fp_…` | 正文指纹 | 不当门牌，不该喂调度 |

decide 契约已是：LLM 回 `bookKey` + prospect 正文 → **台铸** prospectKey。  
所以简化应优先打在 **窗内寻址串**，不是取消实例门牌。

## 可哈希性到底锁什么

档案共识：

- **可调取门牌** = 落账实例 / 协议封印（方案 B），不是正文哈希  
- **时空可回溯** = 经父链回到 `(doc, page, slot, …)` 的 `h1`  
- 指纹只做「像不像」副索引  

简化只要保证：**台账主键仍唯一、可指、可回溯**；LLM 看见的可以是**本窗别名**。

## 推荐：窗内短别名（不丢坐标）

```
台组窗：  b1 ↔ h1.很长…
LLM 只写： "bookKey":"b1" 或 "key":"b1"
台落账前： b1 → 全长 h1，再 settle 铸 pk_/ik_
```

- 全长 `h1` / `pk_` / `ik_` 仍是唯一门牌（可哈希、可导航）  
- 别名只活在**这一次注意力窗**，过期作废  
- 满足「字符级回传」：回传的是窗内合法门牌（`b1`），台再展开  

粗算：一窗 6 个 bookKey，全长各 ~160 字、进出各抄一遍 → 约 2k token；改成 `b1`…`b6` → 可砍一个数量级。

## 次要可做

1. **新铸 `pk_`/`ik_` 再缩短**：`pk_${seq36}`，`settleActionId` 另存；UI/意图仍用短门牌。  
2. **工种分层投喂**：decide/infer 不贴 pk/ik；path/reuse/监督才贴短别名或全键。  
3. **协议层压缩 `h1` 编码**（服务端）：收益大，但动封印，要单独开。

## 不要做

- 用正文哈希替代门牌  
- 让模型自造短码却无窗映射表  
- 为省 token 取消「一槽一 settle」

**结论**：能力上完全做得到——**台账保留长坐标/实例键；LLM I/O 只用窗内可逆短别名**。若你拍板，下一步就先给 decide/infer 组窗加 `bN ↔ h1` 映射表。

