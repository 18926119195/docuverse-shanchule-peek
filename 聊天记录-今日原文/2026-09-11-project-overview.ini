- 对窗内每个输入 bookKey，必须报告三态之一（与增量一一对应）：
- unread：未读/未处理到该 key
- sufficient：对该 key 的增量已充分，可交写信台递送下游
- insufficient：已读但增量不充分，需补材料或换工种
请在 JSON 中给出 "keyStatuses":[{ "key":"…", "status":"unread|sufficient|insufficient" }]（也可在各条 briefs/prospects/judgments 上带 "status" 字段）。
- 窗内每个 bookKey 都必须出现在 prospects.status 或 keyStatuses 里。
- 优先保证 JSON 完整可解析。
