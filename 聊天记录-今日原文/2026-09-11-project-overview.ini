### 1. 建库：`toc_map`（向导）——**现在确实有专用 LLM**

流程在 `TocWizard` + `tocMapLlm.ts`：

```text
你多选「目录相关」PDF 页（strand）
    → 把这些页的 OCR 文本 + 全书稀疏 bookKey 锚
    → 调 toc_map LLM
    → 输出：sections[{ title, startStrand, endStrand, level, … }]
    → 你可手改
    → 确认：代码按 strand 闭区间做 pageRange ∩ A1 → 写 memberKeys
```

LLM 被要求做的事（现码原文）：

