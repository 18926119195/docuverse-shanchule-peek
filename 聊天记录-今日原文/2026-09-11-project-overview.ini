T:
aux dispositifs traditionnels d'infrastructure somatique, d'etatayage instinctuel, de déterminemismes (fondres sur le besoin et le manque), de conditionnement comportemental, etc. A cet effet, les entités relevant de ces quatre domaines n'auront pas d'identifié fixe. Elles ne soutiennent leurs configurations propres que à travers les rapports qu'elles entretiennent entre elles: elles seront appelées a changer d'état et de statut en fonction de leur Agencement d'ensemble. En d'autres termes, elles ne relieront pas d'une topique structureale, et c'est à leurs systèmes de transformation que sera impartie la tache de « gérer » leur modélisation. Pour en mesure de soutenir une telle traverse d'ordres que la pensée classique est toujours employée à tenir séparées, des foncteurs dependront de lois de composition entre deux couples de catégories: l'actuel et le virtuel, le possible et le réel, dont le croisement matriciel est illustré figure 2.
bookKey=`h1.XgAXCHEC3ntftUI0jXc708dUjUaDPyl7p5SO20OzdND_5KeTlNj20A8wMdzPANrMQyLfWnoJWll6MTMyWvzp4pGPCgkHWGMlz6G0i9ShzJAE_zfMCUltjRQNIoixus6jm80vfuHtwPr5_00hQ9w`
T:
Les rapports de presupositions inter-entitiaires, s'incrivent selon les coordonnées de deterioralisation objectives et subjectives, ne tiendront pas sur un pied d'égalité les Flux et les Territoires du reel avec les Phylum et les Univers du possible – ces derniers enveloppant et subsumant les premiers, de telle sorte que le reel du possible prime toujours le sur possible du reel. Dans ces conditions, les Phylum constitueron, en quelque sorte, les *intégrares* des Flux et les Univers les *intégrares* des Territoires (fig. 3).
