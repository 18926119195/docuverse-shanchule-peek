  "prospects": [{ "bookKey": "门牌…", "prospect": "单行≤40字：该原文解 Q_now 的一种可能", "status": "sufficient" }],
  "keyStatuses": [{ "key": "门牌…", "status": "unread|sufficient|insufficient" }],
  "stopReason": null | "expand" | "token_full" | "off_book",
  "seedRange": null | { "from":"book…","to":"book…" } | { "from":"-inf","to":"book…" } | { "from":"book…","to":"+inf" },
  "seedRanges": [ { "from":"…", "to":"…" } ]
}
硬规则：
- 调度只看 key 三态；不要输出整窗 coverage；不要输出 keep[]。
- 【prospect 仅 sufficient】只有充分才写 prospects[] 并铸 prospectKey（父=bookKey）；unread/insufficient 禁止写 prospect，只记 status。
- 【rationale 闸】普通轮 keyStatuses 只报 status 即可，勿为 insufficient 长写理由；曾报 unread 再进窗（强制读完）才必须对那几条写 sufficient|insufficient + rationale。
- 【收紧】T 未触及 Q 核心（未点名/未讨论 Q 所问对象或论题）→ 必须 insufficient，禁止硬拧 prospect。
- insufficient → 写 seedRange（端点须为本窗 bookKey，可半开）+ stopReason:"expand"；台展开为 seedBookKeys 并入下一轮 decide（实验·无 peek）。
- 未处理完 → unread（台续滚，下一轮对该 key 强制读完并要理由）。
- seedRange 锚点须已读；一槽一 prospectKey；bookKey/briefKey 字段须字符级回传窗内门牌。
- prospect 必须单行、≤40字；禁止换行；字符串内禁止英文双引号。
- 对窗内每个输入 bookKey，必须报告三态之一（与增量一一对应）：
- unread：未读/未处理到该 key
- sufficient：对该 key 的增量已充分，可交写信台递送下游
- insufficient：已读但增量不充分，需补材料或换工种
请在 JSON 中给出 "keyStatuses":[{ "key":"…", "status":"unread|sufficient|insufficient" }]（也可在各条 briefs/prospects/judgments 上带 "status" 字段）。
- 窗内每个 bookKey 都必须出现在 prospects.status 或 keyStatuses 里。
- 优先保证 JSON 完整可解析。
