T:
C'est dès ses premiers écrites that Lacan prit distance avec la metapyschologie freudienne. Il a l'a d'ordre professé que la libido n'était qu'un simple système de notation énergétique. Puis, ramenant la thermo-dynamique à l'elle n'etre une qu'un jeu de signifiant; il en est venu à lui d'inier jusqu'à son caractère de Flux, pour en un faire un organe de la pulsion. laquelle se metamorphosse, de son côté, en trésor du signifiant. Toutefois, cette libido, organe de l'incorpore, a courbé à une lamelle volante, immortelle et axusexime comme les amibes, et qu'il qualifiée aussi d'hammelette; ne s'est pasvue completement privée de son statut énergétique, décidément sacro-saint. Mais il ne s'agissit plus, à l'évidence, que d'une énergie assez particulière, puisqu'elle était susceptible, comme Lacan le note, d'une quantiétrie d'autant plus aisé à introduire en théorie qu'elle est inutile, puisque y s'en sont reconnus certains quanta de constance. Et de préciser que sa couleur sexuelle, si formellement maintenance par Freud comme inscribe au plus intime de sa nature, est couleur de vide: suspendue dans la lumière d'une beance. Le terrain ayer et aïssé radicalement déblayé, on se sent plus e
bookKey=`h1.fHwq5w8eDMaMtW13HAtgQbklZHBj_T-eSdHxHqztirZZz6Ecq5A4mdmw6J15OkgIBabNLdQ7dtGKNryoGrMJZc0M9OZ86p9zmlLW_iHMBzQpXPe42Zu-8iiWr5-IYgcWKzePUJpkL1ocnKvFC3Y`
T:
celui que les psychanalystes considérent le leur, à savoir : 1) une performance orale individuelle, centrée généralement sur un certain habitus familialisé de la subjectivité dans le contexte des sociéties industrielles développées; 2) des manifestations affectives circonscrites à l'espace étièle de la cure. La schizoanalyse s'efforce de mobiliser, au contraire, des formations collectives et/ou individuelles, objectives et/ou subjectives, des devenirs humains et/ou animaux, végétaux, cosmiques. Elle sera partie prenante d'une diversification des moyens de sémiotisation et refusera tout centrage de la subjectivité sur la personne, soit distant neutre et bienveillance, d'un psychanalyste. Elle quittera donc le terrain de l'interprétation significante pour celui de l'exploration des Agencements d'dnonciation coucourant à la production d'Affectes subjectifs et d'Effets machiniques (j'enfentés ici que ce qui engage une vie processuelle, une probabilité técartant, si peu que ce soit, des redundances stratifiques, un phylum évolutif, dans quel ordre que ce soit, biologique, économique, social, religieux, esthétique, etc.)
bookKey=`h1.Np3LpmFVV4J8Tgvys2d5wbYTVed6_kC-ZPGPMc7IGHCDxknce_ePPLCozJG4qsX-f5AP46ArEuABLrXI_Z4t0yuvVj0OnMdeEPcenl9dsir6q6C4sDCGoPntLtaHknaa4ZVIO-M1g1DDfVSE834`
T:
Cela signifie-t-il que toute perspective d'évaluation et de prescription scientifique, dans ce domaine, soit définitivement écartée? Peut-on concevoir la reconstitution d'un modele d'Inconscion qui, tout en renonçant au paramètre libidinal • cache • (qui échappait en fait à toute épreuve conceable de *falsifiabilité*) , en n'en conferraient pas moins un statut de plein droit aux énergétiques • au pluriel, je le souigne •, physiques, biologiques, sexuelles, sociales, économiques, etc. ? En elle-même, l'hypothèse d'un debit énergétique associé à chaque opération psychique n'ait nutellement d'dairenable. Il n'ait été légitime de s'en déherrer qu'à partir du moment où elle induisait l'exportation de concepts thermodynamiques hors de leur domaine de validation d'origine, qui avaient précisément été aménagés de façon à en soient exclus les objets incorporels et les processus dissipatifs propres à la vie organique et psychique. L'universalité des principes de convertibilité des énergies et l'acrossissement au cours du temps de l'entropie qui lui est correlative n'est • tenable • que dans le cadre d'Agencies d'enonction scientico-scientifiques bien spécifiques. J'imagine d'ailleurs que per
