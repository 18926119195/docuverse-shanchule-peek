## User

为什么strand上面是162但是机器是163，这两个不是一样的吗？不要改代码

## Assistant

一样，只是两种数法：

- **strand** 从 **0** 起编（程序员下标）  
- **机器第 N 张** 从 **1** 起数给人看 → 永远是 **strand + 1**

所以 strand **162** = 机器第 **163** 张，指的是同一张牌。你填校准时用 **162** 就对。

