musculaire, etc.). Au commencement du chapitre 2, nous avions annoncé que nous aurions à affronter l'aprorie d'un changement d'état sans transfert d'énergie. Nous y voil! Mais il ne faudrait pas entendre notre première formulation comme impliquant l'inexistence de charges énergétiques au sein des systèmes considérés. Simplement, il s'agit d'une énergie non transferable, se trouvant dans un état paradoxal à la fois d'hyper-ralentissement et d'hyper-acélération $d = \infty$ , interdisant tous distinctivement et, par conséquent, tout transfert d'un point au un autre. Je ne vois pas d'autre moyen que de partir d'une telle postulation. Qui dit changement d'état, ou tout simplement modification de que ce soit (ne serait-ce a travers le constat passif de l'héterogénie d'un état de choses par rapport à un autre), dit nécessairement prestation énergétique. Je crois qu'aucn physicien, à supposer qu'il en vienne à se poser ce genre de questions, que nous arait de dégerger à un tél principe! La conscience d'alterné la plus contemplative – celle, par exemple, de Satori dans l'experience Zen – remue les énergies, fusibles-entles énergies, énergies de l'énergie, matières signalétiques et les inde
