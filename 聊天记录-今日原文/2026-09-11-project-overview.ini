**改动要点**
- 校准支持 **双页展开**：`printedPerStrand=2` → `strand = ⌊(印码 − 对起点)/2⌋ + 锚 strand`
- 向导默认「双页展开」，要填本机牌**左+右**两个印码
- 旧语料包缺字段会按 1 印码/牌归一；末节印码估算不再误用 `maxStrand - offset`

**你怎么用**
1. 打开目录向导 → 校准步  
2. 版式选「双页展开」  
3. 转到正文机牌，填该牌左右印码 + strand → 保存  
4. 预览 → 确认目录  

例：strand 20 上是印码 42|43，则 42 与 43 都映到 20，44|45 → 21。

