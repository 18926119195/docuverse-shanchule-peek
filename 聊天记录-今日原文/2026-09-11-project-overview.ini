差别只在 **台先给 decide 多少块、怎么挑**，契约和读法一样（仍是 `bookKey+T`、每批 ≤6、可并行）。

| | 抽 24 + 轮询 | 整节/整走廊入队 |
|---|---|---|
| 进 decide 的集合 | 走廊里抽 24 块（再问核补、再 seedRange 扩） | toc 点中的 strand 范围内 **全部** bookKey |
| 漏点名块 | 容易：24 里常是标题/图/残句 | 难：点名块只要在段内就会轮到 |
| 扩搜依赖 | 高：不够就 expand，易空转挂起 | 低：先扫完本走廊再谈不够 |
| 成本 | 便宜（~4 批） | 贵（157 块 ≈ 26 批） |
| 和 toc 意图 | 目录只当「缩域草稿」 | 目录当「本轮必读闭集」 |

一句话：**抽 24 = 赌取样质量；整节 = 花钱把闭集读完。** 问核补丁是抽 24 时的创可贴，整节入队后通常就不需要当主路径了。

