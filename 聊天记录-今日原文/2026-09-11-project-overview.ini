## Assistant

两件事分开说：

**为什么有 74「章」**  
不是书只有 74 个大部，而是语料里的 `semanticIndex.sections` 把目录里**几乎每一级标题**都收成一条（`source: heuristic`）。瓜塔里这本书目录很碎：Liminaire、几个时代、再 `1.`–`8.` 大部下面一堆小节（Φ、Flux、Ritournelles…），所以会滚到 74 条。后面从大约 `[50]` 起很多标题都挤在 **同一页 p.173**，更像目录尾部条目页码没拆干净，不是真有 20 多个独立正文段。

**`memberKeys` 为空是什么意思**  
每条 section 理想状态应带：`title` + `pageRange` + **`memberKeys`（这章底下有哪些 bookKey）**。  
你这份里 **只有 12 条填了 memberKeys**（前面几段 + 后部几段），**62 条只有标题和页码，成员列表是空的**。

所以 toc 展开时：有成员就用成员；没有就 **按 `pageRange` 把那几页上的所有 bookKey 兜进去**。日志里 `[8] members≈94` 就是「p.42–46 上约 95 个块」，不是事先登记好的 94 个门牌。

一句话：**74 = 碎目录条目数；多数章没挂好成员，只能靠页码把页内所有块当章内材料。**

