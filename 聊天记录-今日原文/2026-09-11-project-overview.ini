## Assistant

## `MAX_HOT_PEEK` 是啥

常量是 **`2`**（`autoFlow.ts`）。

意思是：首轮 `decide → infer` 之后，若 infer 判定不够，最多再做 **2 次**外圈：

`seedRange 扩搜 → 再 decide → 再 infer`

循环是 `postInferExpand <= MAX_HOT_PEEK`，所以一共最多 **1 次首轮 + 2 次扩搜**；触顶就停，不再空扩。

