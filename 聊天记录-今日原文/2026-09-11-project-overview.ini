{"path":"C:\\Users\\Administrator\\Desktop\\docuverse-no-peek-lab\\src\\arch\\qCoreBookHits.ts","streamContent":"/**\n * 问核词面命中：从 Q_now 抽专名/别名，在 A1 上找含该词的 bookKey。\n * 供 toc_nav 取样优先、扩搜空时一次补给（非替代 toc_nav 主路径）。\n */\n\nimport {\n  atomSearchText,\n  isRetrievableAtom,\n  tokenizeQuery,\n} from '../reasoning/hybridRetrieve'\nimport type { BookIndex } from '../reasoning/pipelineA'\nimport { orderedRetrievableBookKeys } from './seedRange'\n\n/** 中文专名 → 书内常见西文写法（OCR 多为法/英） */\nconst CJK_ALIASES: Record<string, string[]> = {\n  拉康: ['lacan', 'lacanien', 'lacanienne'],\n  弗洛伊德: ['freud', 'freudien', 'freudienne'],\n  荣格: ['jung', 'jungien'],\n  德勒兹: ['deleuze'],\n  瓜塔里: ['guattari'],\n  加塔利: ['guattari'],\n  马克思: ['marx', 'marxiste'],\n  黑格尔: ['hegel', 'hégel'],\n  尼采: ['nietzsche'],\n  萨特: ['sartre'],\n  福柯: ['foucault'],\n}\n\nexport function qCoreNeedles(question: string): string[] {\n  const q = question.trim()\n  if (!q) return []\n  const out = new Set<string>()\n\n  const cjkRuns = q.match(/[\\u4e00-\\u9fff]{2,8}/g) ?? []\n  for (const w of cjkRuns) {\n    out.add(w)\n    for (const a of CJK_ALIASES[w] ?? []) out.add(a)\n  }\n\n  for (const t of tokenizeQuery(q)) {\n    if (/^[a-z]{4,}$/i.test(t)) out.add(t.toLowerCase())\n  }\n\n  // 过滤过泛问核（「如何」「批判」等）—— 只留 ≥2 的 CJK 专名已在上；拉丁 ≥4\n  for (const noise of ['如何', '什么', '怎么', '批判', '批评', '理解', '意思', '是否', '提到']) {\n    out.delete(noise)\n  }\n  return [...out]\n}\n\n/** 书序 bookKey：T 含任一 needle（大小写不敏感） */\nexport function bookKeysHittingQCore(input: {\n  bookIndex: BookIndex\n  question: string\n  /** 若给，只在闭集/走廊内命中 */\n  allowedKeys?: ReadonlySet<string> | null\n  maxKeys?: number\n}): { keys: string[]; needles: string[]; note: string } {\n  const needles = qCoreNeedles(input.question)\n  if (needles.length === 0) {\n    return { keys: [], needles, note: '问核词面 · 无专名 needle' }\n  }\n  const maxKeys = input.maxKeys ?? 24\n  const lowerNeedles = needles.map((n) => n.toLowerCase())\n  const hit = new Set<string>()\n  for (const c of input.bookIndex.chunks) {\n    if (input.allowedKeys && !input.allowedKeys.has(c.key)) continue\n    if (!isRetrievableAtom(c)) continue\n    const t = atomSearchText(c).toLowerCase()\n    if (!t) continue\n    if (lowerNeedles.some((n) => n.length >= 2 && t.includes(n))) {\n      hit.add(c.key)\n    }\n  }\n  const keys = orderedRetrievableBookKeys(input.bookIndex)\n    .filter((k) => hit.has(k))\n    .slice(0, maxKeys)\n  return {\n    keys,\n    needles,\n    note:\n      `问核词面 · needle=[${needles.slice(0, 8).join(',')}]` +\n      ` · 命中×${keys.length}` +\n      (input.allowedKeys ? '（走廊内）' : '（全书）'),\n  }\n}\n"}
