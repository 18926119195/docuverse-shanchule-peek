La libido peut se voir conférer deux statues, celui d'une energie processuelle faisant deriver loin de leur position d'équilibre des rapports dynamiques ou celui d'une energie statique concourant à la stratification des formations psychiques. Mais Freud n'est jamais parvieu en la articulier de façon cohérente, même lorsqu'il a postule la coexistence d'une libido d'objet et d'une libido du Moil. En enraiment dans la perspective qui est la nôtre, puisque ces deux statues ne relevent plus des aides d'une balance économique libidinale, mais de choix micro-politiques fondamentales. La libido se trouvera, des lors, «dénatureur» déterrionaireise ; elle devendra une sorte de matire abstraite et de matrice émotionnelle. La libido raterionaireise de la schizoanalyse d'une libido-Phylum (sur l'abscise gauche des figures 1 et 3) comme intégrale des Flux transformations de des matir (desmatir et signalétiques), soit l'ouverture reterrionaireise du freudisme d'une libido-Flux, d'abord enkysterie dans la part somatique des pulsions (la poussée et la source, par contraste avec le but et l'objet), puis mise en stades psychogénétiques, pour être enfin rendue prisonière d'un face-face intemporelle av

