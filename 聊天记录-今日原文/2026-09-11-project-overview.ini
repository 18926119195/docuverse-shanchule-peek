不完全是「拼 bookKey 时算错」，而是**更早一步把 toc_nav 答卷判废了**。

**本该**：toc_nav 只出 `{ seedRanges:[{fromStrand,toStrand}] }` → 台用 `parseTocNavStrandRanges` → `strand∩A1` 拼 bookKey。

**出问题的是**：写信台对**所有** decide（含 toc_nav）都先跑正文用的 `parseDecideOutcome`。那套只认「prospect / 书序门牌 seedRange」；toc_nav 的 `fromStrand` 它不认 → 当成「没解析出有效 decide」→ 触发 JSON 重试 → 答卷被盖成假门 `toc`。  
后面 `parseTocNavStrandRanges` 看到的已是废答，所以 `strand×0`，**根本没走到**正常的 strand→bookKey 展开。

所以：不是 strand∩A1 配对公式坏了，是 **toc_nav 被误当成正文 decide 抢救**，导航结果在展开前就丢了。

