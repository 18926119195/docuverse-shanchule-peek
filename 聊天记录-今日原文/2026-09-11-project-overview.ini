## Assistant

这是 **Docuverse** 的一份完整现码快照（文件夹名带 `no-peek-lab`），用来本地跑和对照架构，不是随便起的小 demo。

它本质上是一个 **PDF 文档宇宙 + LLM 推理工作台**：把书页、OCR、键（bookKey / path / settle / reuse 等）和 3D 画布连在一起，让模型和人在「门面 / 结算 / 监督两轨」上围绕同一套坐标工作。

技术栈大致是：React + Vite + Three.js（3D 页网），外加 Vercel/本地 API 接 LLM。权威架构以 `docs/chat-archive/2026-09-03-architecture-align.jsonl` + 本目录现码为准；`先读我.txt` 也写了别和桌面上别的 `docuverse-*` 目录混用。

