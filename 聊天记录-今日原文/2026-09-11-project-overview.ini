T:
## La séparation
bookKey=`h1.BrRDwIjAJNss6lxF4CxEqz6reAhNGGTy2UOkFplmODausfJZ0hZ9S8nECSlGGyLyyryIoU3A4QUE47eqQztNgmBXIZcp_UybDi_9HUtYlLdtYN9knTJKtAX2STXwh0ZUmypizHjiXUf6BJzqSiE`
T:
J'appelle séparation les transformations inter-entitiaires diachroniques à partir desquelies s'instrumentes des composantes de miotisation. Elle manifeste la propension des états d'entité à sortir d'eux-memes, à se discursurer, de se décalicher, de detalisser, al'attérer. C'est à ce niveau que viennent à l'existence les dimensions complémentaires de temps et de devenir. La séparation n'est ni le décalque ni l'opposé de la non-séparabilité. (Une telle symétrie revientrait en effet à éintroduire dans la non-séparabilité des dimensions siémiotiques « cachees » qui lui conferraient le statut classique d'un possible en attente d'une incarnation dans le reel, soit le statut évolutioniste d'une potentialité en attente d'une actualisation). Quels que soient les processus d'expression qui peuvent advenir, en bien que je la connaisiez, de l'Inventeur qualifié de primaire la non-séparabilité ne connait pas de telles attentes! Le se suffit à elle-même. La séparation est déjà en elle, et, riciproquement, elle peut passer tout entière la séparation sans que l'autonomie ni de l'une ni de l'autre soit affectée. La séparation est inscrit en sur le Plan de Consistance par des tenseurs vectorisés sel
bookKey=`h1.-Sdzt5gIDkN8V-wnMO4q5LidH63cvAHCSWmR-QUhBJNex1IfmmIwmq0f3YxZCvtDx530tOzCS-2C0ftO7iKRoMN9pYQasg52jxyVLhfNNCcZeRJKVP3IfaQYdSfdxecCYT170UPbmaoI6sJwjI4`
T:
## Il existe deux sortes de tenseurs de séparation :
bookKey=`h1.o0fwMGDxK0_8UQW18Zj-ptX26fjzK_5IRYw5AATSfM93Ai_i5Du1xwidn7IdIA-_fHQLEvYWi5AbzMWjX6h9PqoPUsvBuFNjOAW8CQoDrvAGDMgVcObxjWgglrd4sObgq0bt-zDnuyx4VDeZRUM`
T:
- les tenseurs sémiotiques (en trait continu, fig. 4), qui engendrent au sein des domaines latérales à deux de leur point d'origine des sites d'entités de sens (les Territoires sensibles, les Diagrammes, les Noèmes et les Propositions machiniques);
bookKey=`h1.5bpSzZa3uE07NlPPfbJFk-CAFKaZ1U6mp5n4iuN_mQC66u6f0Rn1B98UUl48l7wyUphA4DLNg7ZBkhualhYSTJTseDt3I801TsxfC91OtHOnUo6O5Eu7yvZa2x0Imo8VMhkLYGzbRWfE7uPtbV4`
T:
- les tenseurs de plus-value de possible (AF, $\Delta$T, $\Delta$A, $\Delta$U) qui ont la capacité de relayer les sites d'entités de sens et de les transférer vers des Effets pragmatiques et des Affects subjectifs.
bookKey=`h1.4baKzriApARWlSNh9maXb06NeGmxznrYV6Obeq9CZawKkTlQdNkXpSA-ESElfXV-0_XeYAh9Yk9Ut3uJ5xywy1F3HvfEgycEs8Nz4TxpOE9RmG245Xt_4sxAv1oqHO_nEdLMp4mu6-eX2fEAhoE`
T:
et troisième niveau de la séparation.
Et cependant, pas plus que la séparation n'est une superstructure semiotique de la non-separabilité, la quantification n'est une superstructure pragmatique de la séparation. Son classement en troisième position n'importe nulle subordination par rapport aux deux autres configurations quantiques; elle n'est ni leur decalecule mimétique, ni leur contretype, ni leur synthèse dialectique.
