Keys) {\n      let added = false\n      for (const span of perRange) {\n        if (depth >= span.length) continue\n        const k = span[depth]!\n        if (seen.has(k)) continue\n        seen.add(k)\n        picked.push(k)\n        added = true\n        if (picked.length >= maxKeys) break\n      }\n      if (!added) break\n      depth++\n    }\n    slice = picked\n    void preferN\n  }"}
