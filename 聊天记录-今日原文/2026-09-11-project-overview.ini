T:
nous tenir prêts à accueillir des réorganisationes d'Agencement échappant, sans complexe, aux malédictions de l'identification primaire ou de la relation « d'incorporation orale ». Et c'est justement que ce qui s'est passée avec cette cantatrice qui, si vous me passe l'expression, a parfaitement « encaisse le coup » en conquérant même, à cette occasion, quelques nouveaux degrés de liberté et en se mettant à gérer desmorsai sur Surmoir sur un mode nettement plus accommodant. La perte de consistance d'une composante n'aura donc été assortie, cette fois-à-du d'une inhibition en chaine. Elle aura仆拯壶 de plaque sensible, de rééléauter, de signal d'alarme. Mais de quoi au jeuest? C'est là la toute la question! A laquelle, d'ailleurs, il ne convient pas de s'empresser de réponde. Car elle n'a peut-être pas de réponse à proprer plamert. Un indice a-signifiant – la restriction des performances vocales – marque l'artre de quelque chose, sans interdire, comme le contexte le révéle, qui chose advenire. C'est tout ce qu'on peut en dire! Certaines voies balises de longue date : le chant, le surcodeur moralisant de la mère, connaissait une transformation pragmatique. Ces daits devront-ils être por
bookKey=`h1.XFoPBLE5sK9vUMYIXpYC3iVFENvOOmuaUtQ4tlYnzhQISwkFyAjdt0-MRDv20fHirkqBeJL1RC3hiRdJFpMwzm1VuitVDgQJlliUKCuhKAcc0dNnbsp6_-ojWxJ1TsseR8vkH_C9zIOObay6WRQ`
T:
probabilité de cumul d'effet. Certaints traits de visagéité se sont duilies du visage de la mère, se sont détachés des coordonnées du Surmoi, pour travailler à leur propre compte, sur d'autres lignes de possible, d'autres Constellations d'Univers, tandis que certaines froncements de surveillance paralysaient les parties extrémes de la gamme, transformées, pour l'occasion, en une sorte d'autel sur lequel les offrandes sacrificieles se réveleront, finalement, relativement noir ou neousées. On trouvera peut-être ce genre de description plus proche des mytes et des contes que des schémas scientifiques de la psychologie et de la psychanalyse tels que ceux, exprimé, de la célébre « boule pharyngienne », ou les allers et retours des objets kleiniens, les ruptures d'identification consécutives à l'introjection mélancolique, ou encore de la désintracion de la pulsion de mort... Mais, pourquoi pas!
bookKey=`h1.TSq2PAhaGPgIX3W1rRE8x2M1npPxTdaBepfzRA0i_oB0mFE5SIH9fZnFKGAy9N1uVLlvKiAZh0g_WWdl-DXqJShnWvg8UOE3g9fdhuiNiGNnKfTiSHfyzVS7L-5hzQIjFBb8nf8umeJlY1k3CZk`
T:
## LES FONCTEURS
DE DÉTERRITORIALISATION
bookKey=`h1.TYm2a44du8n8zia9JHKKqKhrXn339igV9StfkUfzoWzSDxRjMQbggpSCjIoNV28SvkVfNrfgOi3g2Q18x48UNloFSFtVx-IrqEAblbduVaRV0Pb6AoabjRwAHrn24w9d2kQULiNNoF7bxYPuqo0`
T:
La catégorie de deterritorialisation devrait nous permettre de séparer la problématique de la conscience – et par voie de conséquence, de l'inconscient – avec celle de la representation du Moi et de l'unité de la personne. L'idée d'une conscience totalisante, voire totalitaire (*Je suis maître de moi comme de l'univers*), participe d'un mythe fondateur de la subjectivité capitalistique. Il n'existe, de fait, que des processus de conscienatisation, diversifiés, résultant de la deterritorialisation de Tertioires existentiens, aux mutilations de la matière. Mais, les mutilations intermédiaires de catalyse d'un pour-iso et de modes de singularisation du rapport aux mondes de l'ensoi et des alter ego, ne sauraient acquirer la consistance d'un monade existentielle, que pour autant qu'il parvient à s'affirmer sur une seconde dimension de deterritorialisation que je qualifiera de discursive énergétique (fig. 1).
