Du cóché $\Phi$. on a, en revanche, une surface de phase $\varphi$, fonctionnant à densité $d^{\infty} \sim \varphi$, qui ressaissit la negativité ou plutôt les negativités $d^{\infty} \sim (\text{fig. 7, chap. 6})$. Il y a a prise de constance, circonscription et résolution des résultats, ilocableses. Une telle prise de constance fractale-moléculaire définit les phasus comme intégration de la determinabilité negative ($d^{\infty} \sim \int d^{\infty}$).
