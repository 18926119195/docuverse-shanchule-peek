T:
Les quanta de « transversalité » dont nous présupposons l'existence en amont des états de matériels et des Univers sens et de valeur, ne pourront pas être décrits dans le cadre des coordonnées coordi-temporelles auxquelques se réfère habituellement la physique des masses et des energies. Mais ces precoordonnées, ces ante-coordonnées ne relevant pas pour autant d'un pur arbitraire, d'un monde lône d'alexe et d'indifférenciation. Oui, alors la l'algèra devrait être entundi au sens que lui donnait Van Gogh, lorsqu'il se qualifiait lui-même de « coloriste aléatoire » – tout la contrainte d'un laisser-alter entropie aux hasards des couleurs communes! Que le matériel de base de l'Inconscient schizanalytique soit constitue par des potentialités non programmées (ou programmes par tronques discontinu), par des lissages et des pièces médias du possible, n'importe en rien de meconnaitre l'existence de stratifications libidinales, de structures répétitives mimant littéralement l'homoe士asis des systèmes de fluctuations physiques à l'équilibre (négociations névrotiques entre the narcissisme et les investissements d'objet, syndromes d'ambition; compulsion de destin, etc.). Simplement, la balance 
bookKey=`h1.JdWNszO-mSNsKKRQv_ch_oFmfgpCYzXR7W4qmWvdZrdvHSVt_s-nyv85llw4Ho9_PP7f7a-8V2OIcncaCgdV9D1kvzOWyleDpX9vAxSWXqNlTCA-GwLWxe1fptIeqzNNcequ0TK4hp8W_NDu4WU`
T:
J'appelle non-séparabilité les correlations synchroniques à distance garantissan des modes de composabilité entre divers d'entité. Cette non-séparabilité s'insture hors de tout critère de localisation sémiotique et son statut de référence intrinsèque ne saurait donc être remis en cause du fait de l'intrusion d'un Agencement ou observateur. Les tenseurs de non-séparabilité sont inscrits sur le plan général de consistance des relations inter-entitaires en fonction d'aux dite de *deterritorialisation* (axe des ordonnées, fig. 1). On sera améné à distinguer ultérieurement deux configurations de *deterritorialisation intrinsèque* les Systems et les Structures, et deux configurations de déterritorialisation extrinsèque: le Contenu et l'Expression sémiotique.
