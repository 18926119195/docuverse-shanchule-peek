Intermédiaire entre quoi et qui? Entre des comportements de pure discursure, qui se n'ouvert au deposition des machiniques « chroniques » et celles qui se dis-posit d'un seul tenant non discursif en Territory existientiel (durées). D'un côté une pseudo-temporalité, un temps de papier-crayon d'ou assistance par ordinateur; de l'autre, un temps une parmiémotion. Entre les deux, d'une part, des temporalités de subjectivité de-filant des mêmes mots, d'autre part, des mots de sécuance vracue, d'une part, comme simultanélisation trans-processus au gré des mythes et meta-modélisation se proposant d'objectiver un « monde » et d'autre part, des moments fécondes « synaptiques » singularisant une présence au présent, à travers les tensions finalisantes qui horizonnent des Constellations d'Univers.
