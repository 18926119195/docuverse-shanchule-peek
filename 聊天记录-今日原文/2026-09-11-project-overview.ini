## Assistant

**不是 infer LLM 来挂 prospect。** 一次 infer 只铸出多个 **inferKey**（各带自己的 `bookKeys[]`）；挂靠是写信台事后做的。

规则（`bindInferProspectByBookLineage`）：

1. prospect 已挂在父门 **bookKey** 上（decide 落的）  
2. infer 的 `bookKeys` 与该 prospect 的父 book **有交集** → 同窝  
3. 台铸候选 **`pathKey = inferKey × prospectKey`**（`matchMode: candidate`）  
4. **不唯一、不贪心**：a/b/c 各自可对多个 prospect；同一 prospect 也可对多个 infer  
5. 信效度：人手 tick 升 `user`，或跳过 → 监督评「ι 是否印证预测」——**LLM 不发明无血缘对**

所以：infer 只负责「这些 book 组合怎么解 Q」；**prospect 怎么挂，看共享 book 血缘，不是看同一次输出的序号。**

