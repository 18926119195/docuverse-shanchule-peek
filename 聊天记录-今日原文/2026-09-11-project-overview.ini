T:
conception d'un Inconscient fondé sur une économie des quantités pulsionnelles et d'un dynamique des représentations conflictuelles, je vourais donc substituire une modifiation transformationnelle telle que, dans certaines conditions, les Territoires du Moi, les Univers de l'alterité, les Complexes de Flux matériels, les machines de désir, les Agencements sémiotiques, iconiques, d'intellection, etc., puisuit s'engendrer les uns les autres. Ausiens a s'il agit-il ici de s'en tenir à la forme des instances, mais d'acceder aux transmutations, aux transductions de leur substance. Notre psychosephique se sépare de celles auxquelles Freud se référait en ce qu'elle refuse de se donner un substrat matériel et énergétique univoye. De ne pas postulaire pas un dualisme manichéen entre ce que l'on pourrait appeler une « inertie énergétique » indifiancée et une « anima » subjective créatrice de diférenciation. « Avant » l'instauration d'une matière et d'une étendre republiques dans les dimensions énergico-spatio-temporelles du monde physique, elle partira de transformations s'instaurant a cheval » entre les domaines les plus hétérogènes qui se puissent concevoir, elle présupposes divers modalit
