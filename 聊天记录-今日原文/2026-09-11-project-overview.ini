T:
Relevons au passage dans notre perspective schizoanalyse d'lucidulation des faits de subjectivation, il ne sera fait qu'un usage très réservé des abords dialectiques, structuralistes, systèmes et même génalogiques, au sens de Michel Foucault. C'est que, selon moi, d'une certaine façon, tous les systèmes de modification se valent, tous sont acceptables, mais uniquement dans la mesure ou leurs principes d'intellibilité renoncent à toute pretention universale et admetten qu'ils n'ont d'autre mission que de concourir à la cartographie de Territoires existentiels, - impliquant des Univers sensibles, cognitives, affectifs, esthetiques, etc. - et cela, sur des aires et pour des périodes de bien délimites. Ce relativisme d'est a d'allure nullement infamable, pour de vue épistémologique; il tient à ce que les régularités, les modalités ou moins stables, que les occurrences subjectives donnent à dechiffrer, relevent précisément avant tout des systèmes d'autoréfinition évoqués plus haut avec la troisième voix de l'autoréfinition. les chalons discursifs - d'expression comme de contenu et de répétition plus de doin en loin, ou à contresens, ou par défaut, les logiques ordinaires des ensembles d

