et signalétiqueques, des formations discursivees staires en deux types d'instance et se trouvant associées au sein des modules de territorialisation: des faisceaux de série de référence à vitesse hyper-acélérées $d^+$ entre lesquels se constituent des espaces de phase ou de mise en suspens de la déterminabilité à vitesse hyper-ralentie $d^+$ (cf. $\$ \bullet$ Le straige d'in-stanciation des Flux $^+$, p. 157). Un tel straige, c'est evident, est synonyme de séparation entre les deux espaces de vitesse de déterminabilité. Mais ce qui l'est moins, c'est de considérer qu'il ne s'agit la que du seul cas de figure ontologique ou il en sera ainsi, ce qui implique une radicale remise en cause, c'est le cas de le dire!, des notions d'instant et de simultanité.
