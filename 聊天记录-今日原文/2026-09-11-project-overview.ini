Avant de poursuire plus avant l'examen des possibilités cartographiques ouvertes par ne quatre foncteurs F.T.F. $\Phi$U. nous devons nous interroger par le statut de la présente entreprise de théorisation. Notre souci principal est de développer un cadre conceptuel qui preunisse la schizoanalyse contre tente tentation s'abandonner à l'idéal de scientifique qui préautor ordinaire dans les domaines *p*y *a* à la manière d'un Surmoi collectif. Nous cherchers pluot à lui trouver un fondement qui l'apparete, par son mode de valorisation, son type de vérité et sa logique, aux discipline esthetiques. Toutes les spécialités professionnelles qui ont affaire à la psychie sont généralement enloppeés d'une aura qui, paradoxement, mèle de façon inextricable l'esprit scientifique et la magie. En ce qui me concerne, je n'ai aucune histiologie de principe à l'égard de la magie. Je considère même que, dans bien des cas, elle constitue un mode de cartographie des Agencements psychiques d'un grand intérêt, quelquefois capable de faire pièce, dans le contexte des méde-

