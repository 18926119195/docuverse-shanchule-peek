## Assistant

在 DeepRead 里，**Retrieve** 是 agent 的第一个工具：用语义检索在整份（或多份）文档里**定位**相关段落，返回：

1. **轻量预览**（片段内容）  
2. **结构坐标** `(文档 d, 章节 i, 段落 j)` —— 告诉模型「证据大概在哪」

它**不**等于把整章正文塞进上下文；真正按顺序读完整段/整节，靠的是另一个工具 **ReadSection**（论文里的 Read）。

所以那句的意思是：

- **Retrieve + Read**：先搜到坐标，再按坐标连读 → 多文档也能找对人/对章  
- **只 Read、不 Retrieve**：模型只能盲开章节读，单文档还能靠 TOC 碰运气；多文档几乎找不到该读哪本 → QASPER 从 ~68% 掉到 ~17%

和你们写信台的对应关系大致是：**Retrieve ≈ BM25/TOC 门廊定位；Read ≈ peek/读入 settle 正文。**

