当你已经用搜索捞出一堆「可能相关」的文档后，要决定 **先看哪一篇**。  
span 数回答的是一句话：

> 这篇里，查询词被踩中了几次？

踩得多 → 先排前面 → 先读 / 先返回。

就这一件事。不负责建索引，不负责选章节，不负责回答问题。

---

### 放回整条链路

```
① MATCH：这篇有没有查询词？     → 进不进候选池
② span 数：踩中几次？           → 候选里谁排前
③ 短优先 / 时间 / id            → 次数一样时再比
④ 把排前面的正文给模型
```

所以：**span = 候选池内部的「相关强度」尺子**，不是检索入口。

---

### 一个直觉例子

问：`Lacan`

| 文档 | 情况 | span | 谁先 |
|------|------|------|------|
| A | 「Lacan」出现 3 次 | 3 | 先读 A |
| B | 「Lacan」出现 1 次 | 1 | 后读 B |
| C | 完全没有 | — | 根本不进池子 |

A 更像「在讲 Lacan」；B 可能只是顺口提了一句。

---

