详细对比与证据链放在可并排打开的研究画布：[PDF 精准检索 SOTA](C:\Users\Administrator\.cursor\projects\c-Users-Administrator-Desktop-docuverse-shanchule-peek-experiment-no-peek-prospect-as-index\canvases\pdf-precise-search-sota.canvas.tsx)（Canvas 是聊天旁的独立可视化面板，方便反复对照）。

### 他们为什么「没读完」也能答
上传时就把书编成索引（页/段/节/版面图）；提问时只搜索引，再把极少证据塞进模型。查询路径从不扫全书。

### 四条主线
1. **混合 RAG（厂商默认）**：OpenAI / Gemini File Search = 分块 + embedding + 语义/关键词混合；Anthropic 还有 Contextual Retrieval（块前加文档语境，失败率可再降约 49–67%）。
2. **视觉 Late Interaction**：ColPali → ColQwen2.5，页当图编码、MaxSim 匹配；Google **MUVERA** 把多向量检索压到接近单向量速度（相对 PLAID 约 +10% 召回、−90% 延迟）。
3. **结构感知动态检索（当前综合效率冠军）**：**LAD-RAG**（ACL 2026）= 版面符号图 + 神经索引 + agent 按题自适应取证；平均完美召回 &gt;90%、无需调 k，同噪声下可比 ColPali/RAPTOR 高约 10–20%。
4. **Agentic 先定位再精读**：PageIndex / DeepRead / DocAgent——像人一样先看目录树，再只读相关节；token 往往最省。

### 截止今日怎么选
| 目标 | 技术 |
|------|------|
| 复杂版面、多页证据、精准且少噪声 | **LAD-RAG 范式** |
| 扫描件/图表页级命中 | **ColQwen2.5 + MUVERA** |
| 目录清晰的专业书、工程可落地 | **PageIndex / DeepRead 式树检索** |

实践上最优组合通常是：入库建目录/版面图 + 页级视觉或多粒度文本向量 → 查询时 agent 先缩范围再精排 → 只精读命中节。这和你仓库里「目录/prospect 定位再 infer」是同一类思路。

