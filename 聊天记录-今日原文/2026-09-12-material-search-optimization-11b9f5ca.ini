| 标向量 | embedding API | 无关 |
| 聚类 | 近邻 / 阈值聚类 | 无关 |
| 计 span | 簇内匹配次数 | 可选用 BM25 做簇内词面召回 |

所以更准确的说法是：**稀疏信号挖候选 + 稠密信号并族 + 族级 span 计数**。

