## User

bm25如何算稀有来着

## Assistant

稀有度在 BM25 里靠 **IDF（逆文档频率）**：词出现在越少的文档里，越「稀有」，权重越高。

---

### 核心想法

```text
某个词 w 的稀有度 ≈ log( 语料里总文档数 / 含有 w 的文档数 )
```

- 「猫」到处都有 → 分母大 → IDF 小 → 不太值钱  
- 「拉康」只在几篇里出现 → 分母小 → IDF 大 → 很值钱  

---

### 常见写法（示意）

\[
\mathrm{IDF}(w) = \ln\frac{N - df(w) + 0.5}{df(w) + 0.5}
\]

| 符号 | 含义 |
|------|------|
| \(N\) | 语料里文档总数 |
| \(df(w)\) | 至少出现过词 \(w\) 一次的文档数 |

\(df\) 越小 → 分式越大 → \(\ln\) 越大 → 越稀有。

---

### 放进 BM25 整式（直觉）

```text
BM25 ≈ Σ  每个查询词的 [ IDF(稀有) × 词频增益 × 长度归一 ]
```

稀有只决定 **「这个词值多少」**；  
同一词在某篇里出现几次、这篇有多长，由另外两项管。

---

### 一句

**稀有 = 全库里很少文档带这个词；BM25 用 IDF 把这种词抬高，把停用词压下去。**

