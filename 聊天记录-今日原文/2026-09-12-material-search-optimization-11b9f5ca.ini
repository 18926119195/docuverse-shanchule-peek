所以用：

- span 次数（这篇自己被高亮几次，不依赖全库 \(N\)）  
- 这篇自己的长度（绝对码点数，不依赖 \(avgdl\)）  
- 时间、id  

这些量 **两边算法一样、不引用各表自己的语料统计**，就可以混排。

