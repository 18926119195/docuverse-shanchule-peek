### PageIndex/DeepRead vs LAD-RAG
| | **PageIndex / DeepRead** | **LAD-RAG** |
|--|--|--|
| 找材料 | 目录树/坐标 → LLM 选节 → 精读 | 版面符号图 + 向量 → agent 自适应取证 |
| 强项 | Token 省、可解释、贴「先定位再证明」 | 多页证据更全、同噪声召回更高 |
| 代价 | 靠结构质量；多轮工具 | 入库贵（页级 LVLM） |
| 对你 | **同构主路线** | 只借「按题调取证深度」 |

### DeepSeek Harness：搜「提高推理材料准确率」
官方 [deepseek-ai/deepseek-harness](https://github.com/deepseek-ai/deepseek-harness) 自带的是 **会话 FTS**（session-query）和 **web_search**，不是 PDF 书 RAG。真正贴「送进模型的材料」的是社区插件：

**优先看（文档/KB 检索）**
1. [htcqp802/dsh-knowledge-base](https://github.com/htcqp802/dsh-knowledge-base) — 按节切块 + FTS5 BM25 + `kb_query`（最贴近你现有 BM25 漏斗）
2. [omdsh-dev/dsh-kb-sieve](https://github.com/omdsh-dev/dsh-kb-sieve) — 可审计 KB + 原文回读
3. [JohnXu22786/docindex](https://github.com/JohnXu22786/docindex) — FTS5 + 本地 embedding 混合，带行号引用

**可借配方（记忆向，别当书索引）**  
[kenz1117/dsh-engram](https://github.com/kenz1117/dsh-engram)、[Asher-2000/dsh-memory-connect](https://github.com/Asher-2000/dsh-memory-connect) — FTS5 + 向量 + RRF

**间接抬信噪比**  
[vibeinging/dsh-tool-search](https://github.com/vibeinging/dsh-tool-search) 等 — 渐进披露工具，少塞无关 schema

总表：[awesome-dsh-plugin](https://github.com/awesome-dsh-plugin/awesome-dsh-plugin) · [topic:dsh-plugin](https://github.com/topics/dsh-plugin)

对你项目：范式继续 PageIndex/DeepRead；工程上优先对照 **knowledge-base / kb-sieve / docindex** 的「切节 → FTS → 再读原文」。

