两件事要分开：**谁算「命中」**，以及 **span 数怎么数出来**。DSH 里没有单独叫「命中函数」的 API；命中是 FTS5 做的，span 数是高亮标记数出来的。

---

### 1. 「命中」是什么

流程是：

```
查询字符串（当普通短语，不当 FTS 语法）
    → SQLite FTS5 MATCH
    → 哪些「文档」（一条会话事件的语义文本）含有查询里的 token
    → 这些文档 = 命中集
```

分词器用 `unicode61`：按 Unicode 词规则切词。  
所以「命中」= **文档里出现了查询切出来的词**，不是任意子串（`AI` 对不上嵌在 `BRAID` 里那种）。

---

### 2. span 数是什么

命中之后，FTS5 的 `highlight()` 会把**每一个匹配片段**包上特殊标记：

```
原文:  ... discussed Lacan and the lacaniens school ...
高亮:  ... discussed 【Lacan】 and the 【lacaniens】 school ...
```

这里每一个 `【…】` 就是一个 **span（匹配跨度）**。  
**span 数 = 这篇文档里被包起来的匹配片段个数**（实现里叫 `match_count`）。

DSH 用的标记是不可见字符 `\uFDD0` / `\uFDD1`，算法等价于：

```text
match_count = 高亮串里「起始标记」出现了几次
```

源码里用长度差来算：拿掉所有起始标记后，字节少了多少 ÷ 标记长度 = 次数。

---

### 3. 举例

查询：`Lacan`

| 文档 | 原文里几次相关 token | span 数 |
|------|----------------------|---------|
| A | 「Lacan」出现 3 次 | 3 |
| B | 「Lacan」出现 1 次 | 1 |
| C | 没有 Lacan | 不进命中集 |

排序时 A 排在 B 前（span 多）。  
若 A、B span 一样，再比「文档更短的优先」。

---

### 4. 和「命中函数」的对应关系

| 你口头说的 | DSH 实际 |
|------------|----------|
| 命中函数 | **没有**独立函数名；= `FTS5 MATCH`（词是否在文档里） |
| span / 命中强度 | `highlight()` 标出的片段个数 → `match_count` |
| 用来干嘛 | 排序第一键：谁「踩中」更多次 |

一句话：**命中 = MATCH 过不过关；span 数 = 过关后这篇里被高亮了几段。**

