### 2. 会话 FTS（session-query）是什么

**一句话**  
DeepSeek Harness 给 **聊天会话历史** 做的全文检索，不是给 PDF 书做的。搜的是「以前说过/工具返回过什么」，不是「书第几章」。

**原理分层**

```
会话事件日志（权威、append-only）
        │ 抽取语义文本
        ▼
派生 SQLite FTS5 索引（可重建，不污染权威日志）
        │ MATCH + 排序 + snippet
        ▼
ctx.sessionQuery.searchSessions / searchEvents
        │
        ▼
模型侧工具（搜会话 → 读命中片段）→ 再推理
```

**细节逻辑**

1. **搜什么**  
   每条可检索事件 → 一篇 FTS 文档。含：用户/助手消息正文、工具名与参数/结果、todo、错误状态等。  
   **不含**（默认）：纯 reasoning 块、流式 chunk、结构性边界——避免把「思考草稿」当成可引用事实。

2. **surface（表面）**  
   事件标成 `current` / `shadowed` / `log-only`。  
   压缩/替换后旧内容仍可在索引里（可被搜到），但与模型当前可见历史一致地分类——所以叫「与模型所见历史对齐」。

3. **双表：持久 + 热会话**  
   - 已落盘会话 → 持久 FTS 表  
   - 正在聊、尚未 checkpoint 的 → 连接级 **TEMP** 表盖在同 id 上  
   这样「刚说完的话」也能搜到，又不会把未提交事件写死进权威库。

4. **查询安全**  
   用户 query 被当成 **字面短语**（引号转义），不能当 FTS 语法执行（禁止随便 `OR`/`NEAR`/`*` 注入）。

5. **排序（刻意不用跨表 BM25 分）**  
   持久表和 TEMP 表规模不同，BM25 分不可比。他们用：  
   命中 span 数 ↓ → 文档长度 ↑短优先 → 时间 ↓ → id/seq 定序。

6. **分词**  
   `unicode61`（不是 trigram）：索引更小，支持短 token（如 `AI`）；子串召回弱，另有字面 scan 兜底。

7. **和书检索的关系**  
   提高的是 **跨轮上下文召回准确率**；不会替你从 35MB PDF 里找章节。书材料仍靠你的目录/BM25/agent 读节。

