| | TF | span 次数 |
|--|--|--|
| 量的是 | 词在文档里的频次 | 高亮匹配片段数（常很接近「踩中几次」） |
| 进不进公式 | 要饱和 + 和长度、IDF 乘在一起 | 多数情况下就是整数直接比大小 |

---

**一句：TF = 这篇里这个词有多密；IDF = 这个词在全书库有多稀。BM25 = 两者（再加长度）合在一起打分。**

