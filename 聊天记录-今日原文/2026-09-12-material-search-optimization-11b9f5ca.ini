关键点：**没有同台实验证明「DeepRead 比 PageIndex 更好」**。你看到的「更好」，多半是 DeepRead 表里相对 **Dense RAG / RAPTOR / Search-o1** 更强；PageIndex 的 98.7% 是另一条评测线，不能拿来反推谁赢谁。

若只比「建结构方式」，后者看起来更弱，但 DeepRead 赢的**不是「发明树更牛」**，而是别的：

### 1. 增益主要来自「怎么读」，不是「树造得多花」
DeepRead 相对 Search-o1 的大头是：**有坐标的连读（ReadSection）**，避免扁平 chunk 把证据拆碎。Search-o1 已经会搜；再加结构连读 → ContextBench +17pt。  
PageIndex 的强项是 **LLM 在树上推理选节点**；两边优化的环节不同，不是「发明树 vs 抽 heading」的对决。

### 2. 「忠实抽 heading」往往比「发明章节」更稳
版面里真有标题时，DeepRead 的树是**文档里本来就有的骨架**，坐标可对齐原文。  
PageIndex 无 TOC 时 LLM **合成**章节：可能切错边界、标题幻觉、层级乱——树好看，导航却指错页。独立复现里 PageIndex 在弱结构域也会输向量，和这有关。

### 3. 评测材料偏「抽得出结构」
FinanceBench / 论文 / 大纲类 PDF，OCR 后 heading 通常够用；这时「发明树」的边际收益小，**连读 + 多工具**更吃香。DeepRead 并没主打「无标题小说」这种最难 case。

### 4. 成本形态不同
PageIndex：建树就要大量 LLM（发明 + 摘要），检索还可能再 LLM。  
DeepRead：建索引偏 OCR/解析；贵在**问答时多轮工具**。表好看，不等于更省或更普适。

---

**一句话**：后者显得更好，是因为在**长文档 + 可解析层级**上，它用论文把「结构门廊 + 定位后连读」打赢了主流扁平 RAG；**不是**证明「不发明树的建索引方式优于 PageIndex」。真无结构时，PageIndex 那种**主动造树+摘要**反而可能更有必要——只是目前缺干净同台对比。

