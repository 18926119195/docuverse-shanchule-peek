### 为啥 BM25「跨表」麻烦

BM25 的 IDF、\(avgdl\) 都依赖 **「这一整库有多大、平均多长」**。

- 持久表：\(N=10000\)，\(avgdl=大\)  
- TEMP 表：\(N=50\)，\(avgdl=小\)  

同一个词在两边算出的 BM25 分 **尺子不同**，不能拿来比谁更大——就像摄氏和华氏直接比数字。

