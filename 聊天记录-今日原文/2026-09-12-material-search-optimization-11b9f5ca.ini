这是 **四级比较键**：从上到下，前一级不等时就定胜负，后面的不再看。

```
比较两条候选文档 A vs B
  ① 命中 span 数：多的排前
  ② 若相等 → 文档长度：短的排前
  ③ 若再相等 → 时间：新的排前
  ④ 若再相等 → id/seq：字典序/序号定序（保证稳定、可复现）
```

---

### 每一级在说什么

**① 命中 span 数（越多越好）**  
FTS 匹配时，一条文档里被高亮/切出的匹配片段个数。  
「踩中几次」——踩得越多，越像真相关，而不是碰巧撞上一个词。

**② 文档长度（越短越好）**  
同样命中次数时，短文档 = 匹配更「密」。  
例如：两个词都命中，一段 50 字 vs 一篇 5000 字——短的更可能就是答案本身，而不是长文里偶尔带了这两个词。

**③ 时间（越新越好）**  
匹配形态一样时，更新的会话/事件优先（对话场景里「最近说过的」更有用）。

**④ id / seq（打破平局）**  
前面都打平，用稳定标识定序，避免同一次查询结果乱跳。

---

### 为什么写成「↓ / 短优先」

| 写法 | 含义 |
|------|------|
| span 数 **↓** | 按该字段**降序**（大→小） |
| 长度 **短优先** | 按长度**升序**（小→大） |
| 时间 **↓** | 时间戳**降序**（新→旧） |
| id | 升/降都行，关键是**固定规则** |

---

### 一张直觉图

```
相关？ ──看──► 踩中几次多不多？
                │
                ├─ A 踩 5 次，B 踩 1 次 → A 先（①）
                │
                └─ 一样多次
                      │
                      ├─ A 很短，B 很长 → A 先（② 短密）
                      │
                      └─ 一样长
                            │
                            ├─ A 更新 → A 先（③）
                            └─ 还一样 → 用 id 钉死顺序（④）
```

---

### 和 BM25 的关系（一句）

这不是 BM25。BM25 用「词稀有度 × 词频 × 长度归一」算出一个分；这里是因为 **两张表规模不同、BM25 分不可比**，改成只用「本条自己的命中形态 + 长度 + 时间」这种 **不依赖全库统计** 的尺子来混排。

