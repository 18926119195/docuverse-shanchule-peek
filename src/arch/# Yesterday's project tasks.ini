**尾部重叠**就是：这一批的**结尾几段文字，下一批开头再放一遍**。

举例（字数只是示意）：

```
全书残文： [A][B][C][D][E][F][G]…

第 1 批： A B C D E
第 2 批：       D E F G     ← D、E 又出现了一次（重叠）
```

若短语正好骑在「E 末尾 + F 开头」，在第 1 批可能被切断，但在第 2 批里 **D+E+F 连在一起是完整的**，默写就能抄全。

多抄到的重复词，后面整串去重会并掉，所以重叠是故意多看一点边界，换不断词。

