**unit** = 我们攒批时的最小整块：一条 A1 门上的纯原文 `PlainText`（一段 `T`），对应一个 layout 槽抠出来的正文。  
攒批时 **整段加、整段移**，不会在一段 `T` 中间砍字。

### 「批末那个 unit」怎么抓住

flush 一批时，当前批里有一串下标，例如：

```
本批 units： … U₈ U₉ U₁₀   ← U₁₀ 是批末最后一个
```

重叠逻辑从 **最后一个往前攒**：

1. 先把 `U₁₀` 放进「带去下一批」的列表  
2. 若累计字数还不到 `overlapChars`（默认 80），再往前加 `U₉`、`U₈`…  
3. 通常一段就够 80 字 → **只带 U₁₀**  

下一批开头就是：`U₁₀` + 后面新来的 `U₁₁`…

所以「拉康」若在 `U₁₀` 末尾、「成员」在 `U₁₁` 开头 → 下一批是 `U₁₀+U₁₁`，能拼上。

代码上就是：`for (从 indices 末尾往前)` → `keep.unshift(最后一个)` → 直到字数 ≥ 80。

