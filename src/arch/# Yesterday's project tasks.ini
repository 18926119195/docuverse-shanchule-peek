### 真正会误抽的泄漏口

1. **整 chunk JSON 当正文扫** → `h1.…`、`bbox` 数字、`layoutK` 会被规则当成「词」  
2. **对全局导出 `.md` 扫** → 每段前面的 `` KEY: `h1.…` `` 会污染（应用 `.jsonl` 的 `T` 字段，或内存里的 `atomSearchText`）  
3. **fig 壳 / 机读 note** → `[FIG:…]`、模板提示句（`atomSearchText` / `isRetrievableAtom` 已在挡一部分）  
4. **T 里的非论述壳** → HTML、Markdown 标题符、页眉页脚（是原文层噪声，不是坐标，但也该洗净）

